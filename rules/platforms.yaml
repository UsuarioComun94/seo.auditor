# Limitaciones conocidas por plataforma, para llenar "arreglable_en_plataforma" en la planilla.
#
# IMPORTANTE: solo se listan límites de alta confianza. Que una regla NO figure acá no significa
# que se pueda arreglar: significa que no hay dato. Estas capacidades cambian con el tiempo;
# verificar en la ayuda oficial de la plataforma antes de prometerle algo a un cliente.
# Para sumar una plataforma o un límite basta con editar este archivo.

platforms:
  google_sites:
    label: Google Sites
    limits:
