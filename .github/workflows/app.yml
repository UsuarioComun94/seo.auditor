name: Construir la app de escritorio

# Gratis: los runners de GitHub arman el instalador de Windows y de macOS.
# Manual (Run workflow) para probar, o al publicar una etiqueta app-v* para crear un Release con los archivos.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Para publicar un Release con las descargas, escribí la versión (ej. app-v0.1.0). Vacío = solo armar"
        required: false
        default: ""
  push:
    tags: ["app-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: seo-auditor-windows.zip
          - os: macos-latest
            asset: seo-auditor-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-app.txt
      - run: pip install -e .
      - name: Prueba unitaria de la lógica de la app
        run: |
          pip install pytest
          python -m pytest -q tests/test_app.py
      - name: Armar la app (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --onefile --windowed --name seo-auditor
          --collect-submodules keyring --collect-data certifi --paths src scripts/app_entry.py
      - name: Armar la app (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --onedir --windowed --name seo-auditor
          --collect-submodules keyring --collect-data certifi --paths src scripts/app_entry.py
      - name: Prueba de humo del instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SEO_APP_SELFTEST_OUT: ${{ github.workspace }}\selftest.txt
          REQUIRE_GUI: "1"
        run: |
          $p = Start-Process -FilePath "dist\seo-auditor.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no se generó selftest.txt" }
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Prueba de humo del instalador (macOS)
        if: runner.os == 'macOS'
        env:
          SEO_APP_SELFTEST_OUT: ${{ github.workspace }}/selftest.txt
          REQUIRE_GUI: "1"
        run: |
          dist/seo-auditor.app/Contents/MacOS/seo-auditor --selftest
          cat selftest.txt
      - name: Comprimir
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path dist/seo-auditor.exe -DestinationPath out/${{ matrix.asset }}"
          else
            ditto -c -k --keepParent dist/seo-auditor.app out/${{ matrix.asset }}
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/app-v') || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: assets
          merge-multiple: true
      - name: Crear el Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-${{ github.ref_name }}}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "${{ github.sha }}" --repo "${{ github.repository }}" --generate-notes --title "App de escritorio $TAG"
          gh release upload "$TAG" assets/* --repo "${{ github.repository }}" --clobber
