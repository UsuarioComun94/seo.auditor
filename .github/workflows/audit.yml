name: Auditoría SEO

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Nombre del archivo en clients/ (sin .yaml)"
        required: true
        default: fixture
      publish:
        description: "Publicar a Google Sheets y Drive"
        type: boolean
        default: true
      site:
        description: "Sitios del Panel (Drive): all, o el nombre de uno. Vacío = no corre el job de sitios"
        required: false
        default: ""
  schedule:
    # Semanal, lunes 09:00 UTC. Corre sobre el fixture hasta que haya configs de clientes.
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "rules/**"
      - "schema/**"
      - "clients/**"
      - "fixture/**"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.inputs.client || 'fixture' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Chromium para renderizar JavaScript
        run: python -m playwright install --with-deps chromium
      - name: Tests
        run: pytest -q

  audit:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLIENT: ${{ github.event.inputs.client || 'fixture' }}
      # En push solo se valida; se publica en cron o ejecución manual con publish=true.
      DO_PUBLISH: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Validar nombre de cliente
        run: |
          if [[ ! "$CLIENT" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Nombre de cliente inválido: solo letras, números, guion y guion bajo"
            exit 1
          fi
      - name: Auditar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS=(--config "clients/${CLIENT}.yaml" --output-dir output --quiet)
          # El fixture tiene errores plantados: el recall debe ser 100%
          if [ "$CLIENT" = "fixture" ]; then ARGS+=(--expected fixture/EXPECTED_ISSUES.yaml); fi
          if [ "$DO_PUBLISH" = "true" ]; then ARGS+=(--publish); fi
          python -m seo_auditor "${ARGS[@]}"
      - name: Guardar CSV completos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawl-${{ env.CLIENT }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore

  sitios:
    # Sitios reales (propios, clientes, competencia) leídos del Panel en Drive. El repo es público y los
    # logs también: el motor oculta nombres, dominios e IDs con ::add-mask:: y acá NO se suben artifacts.
    needs: test
    if: github.event_name == 'schedule' || github.event.inputs.site != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEO_PANEL_ID: ${{ secrets.SEO_PANEL_ID }}
      SITE: ${{ github.event.inputs.site || 'all' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PSI_API_KEY: ${{ secrets.PSI_API_KEY }}   # opcional: PageSpeed y CrUX (gratis); sin clave, sin datos de campo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Chromium para renderizar JavaScript
        run: python -m playwright install --with-deps chromium
      - name: Auditar sitios del Panel
        run: |
          if [ -z "$SEO_PANEL_ID" ]; then
            echo "Falta el secret SEO_PANEL_ID: se omite el job de sitios."
            exit 0
          fi
          python -m seo_auditor --panel --site "$SITE" --output-dir /tmp/seo-out
