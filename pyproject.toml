[project]
name = "seo-auditor"
version = "0.6.0"
description = "Auditor SEO autónomo, multicliente y de costo cero"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "defusedxml>=0.7",
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
]

[project.optional-dependencies]
app = ["keyring>=24"]

[project.scripts]
seo-auditor-app = "seo_auditor_app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
